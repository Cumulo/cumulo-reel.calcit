name: Compiles only

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@704b3f5cd6f9ce3bd1e0c926dbdd1d181adb8180 # v1.4.0
      with:
        tools: calcit,caps

    - name: "load deps"
      run: caps --strict --ci && yarn install --immutable && caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry server --check-only
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --entry server analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Run Calcit tests
      run: calcit calcit.cirru test --require-match --summary-only --format json

    - name: "compiles to js"
      run: >
        calcit calcit.cirru js
        && yarn vite build
        && calcit calcit.cirru --entry server js
        && node --check js-out/cumulo-reel.app.server.mjs
        && node --input-type=module -e 'await import("./js-out/cumulo-reel.app.server.mjs")'

    - name: Exercise Node server runtime
      run: node --test scripts/server-runtime.test.mjs
