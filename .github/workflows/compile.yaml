name: Compiles only

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && 'pr' || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    # Current Respo/js-ffi manifests still request preceding compatible
    # releases, so strict Caps resolution rejects the highest SemVer set.
    - name: "load deps"
      run: caps --ci && yarn install --immutable && caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --warn-dyn-method
        calcit calcit.cirru --entry server --check-only --warn-dyn-method
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Run Calcit tests
      run: calcit calcit.cirru test --require-match --summary-only --format json

    - name: Build client with CDN asset URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"

    - name: Compile Node server
      run: |
        calcit calcit.cirru --entry server --emit-path js-server-out js
        node --check js-server-out/cumulo-reel.app.server.mjs
        node --input-type=module -e 'await import("./js-server-out/cumulo-reel.app.server.mjs")'

    - name: Exercise Node server runtime
      run: node --test scripts/server-runtime.test.mjs

    - name: Upload static assets to COS
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: worktools/cos-upload-action@v1.2.0
      timeout-minutes: 10
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}
